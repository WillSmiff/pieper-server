; Load the standard modules, minus channel drivers and services the pager line doesn't use
; (several of them would open extra network ports).
; Install: sudo install -m 640 -o root -g asterisk deploy/asterisk/modules.conf /etc/asterisk/modules.conf
[modules]
autoload=yes

noload => chan_iax2.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_ooh323.so
noload => pbx_dundi.so
noload => res_pjsip_phoneprov_provider.so
noload => res_phoneprov.so
