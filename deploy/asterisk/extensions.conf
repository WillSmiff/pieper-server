; Asterisk dialplan for the pager phone line.
; Install: sudo install -m 640 -o root -g asterisk deploy/asterisk/extensions.conf /etc/asterisk/extensions.conf
;
; Caller flow:
;   1. "Please enter your password followed by the pound key"  -> phone PIN, then #
;   2. beep  -> press the preset key (1-9)
;   3. the key is read back, beep -> press 1 to send (any other key: choose again)
;   4. "Thank you. Goodbye."  -> the page has been sent
; A wrong PIN plays "Login incorrect" (3 tries per call). Three beeps mean something went
; wrong (phone paging turned off or locked after too many wrong PINs, or server down).
;
; IMPORTANT: this file contains no Dial() or other outgoing application on purpose.
; Nothing reachable from the SIP trunk can place a call, so the trunk can't be used
; for toll fraud. Keep it that way.

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]

; Every call from the trunk, whatever number it was dialled on, goes to the menu.
[from-trunk]
exten => s,1,Goto(pager-menu,s,1)
exten => _X.,1,Goto(pager-menu,s,1)
exten => _+X.,1,Goto(pager-menu,s,1)
exten => i,1,Hangup()

[pager-menu]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=180)            ; no call lasts longer than 3 minutes
 same => n,Set(PIN_TRIES=0)
 same => n,Wait(1)

 ; ---- PIN
 same => n(pin),Set(PIN_TRIES=$[${PIN_TRIES} + 1])
 same => n,GotoIf($[${PIN_TRIES} > 3]?bye)
 same => n,Read(PIN,agent-pass,12,,1,10)         ; ends with # or after 10 s
 same => n,GotoIf($["${PIN}" = ""]?bye)
 same => n,AGI(/usr/local/lib/pager/pager-agi.py,check)
 same => n,GotoIf($["${PAGER_RESULT}" = "pin_ok"]?choose)
 same => n,GotoIf($["${PAGER_RESULT}" = "bad_pin"]?badpin)
 same => n,Goto(error)
 same => n(badpin),Playback(auth-incorrect)
 same => n,Goto(pin)

 ; ---- preset
 same => n(choose),Read(PRESET,beep,1,,1,10)
 same => n,GotoIf($["${PRESET}" = ""]?bye)
 same => n,SayDigits(${PRESET})
 same => n,Read(CONFIRM,beep,1,,1,10)
 same => n,GotoIf($["${CONFIRM}" != "1"]?choose)
 same => n,AGI(/usr/local/lib/pager/pager-agi.py,send)
 same => n,GotoIf($["${PAGER_RESULT}" = "ok"]?sent)
 same => n,GotoIf($["${PAGER_RESULT}" = "no_preset"]?nopreset)
 same => n,Goto(error)
 same => n(nopreset),Playback(pbx-invalid)       ; "...not a valid extension, please try again"
 same => n,Goto(choose)

 same => n(sent),Playback(auth-thankyou)
 same => n(bye),Set(PIN=)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

 same => n(error),Set(PIN=)
 same => n,Playback(beep&beep&beep)
 same => n,Hangup()
