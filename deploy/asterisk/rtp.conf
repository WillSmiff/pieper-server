; Audio (RTP) ports. A small range is plenty for a few simultaneous calls (2 ports per call),
; and keeps the firewall opening small. Must match the ufw rule in the README.
; Install: sudo install -m 640 -o root -g asterisk deploy/asterisk/rtp.conf /etc/asterisk/rtp.conf
[general]
rtpstart=10000
rtpend=10099
