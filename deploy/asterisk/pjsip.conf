; Asterisk PJSIP configuration for the pager phone line: ONE incoming SIP trunk, nothing else.
; Install: sudo install -m 640 -o root -g asterisk deploy/asterisk/pjsip.conf /etc/asterisk/pjsip.conf
;
; Fill in the four placeholders from your SIP provider's account details:
;   SIP_SERVER    e.g. sip.example-provider.nl (the registrar / proxy host)
;   SIP_USERNAME  account or "SIP username"
;   SIP_PASSWORD  SIP password (this file is readable by root and asterisk only)
;   PROVIDER_IP   the provider's signalling IP or subnet, e.g. 203.0.113.0/24
;
; Security model:
;   - Only one endpoint exists ("trunk"). There are no phones or extensions, so nobody can
;     register to this server, and there is no anonymous endpoint: calls from anywhere else
;     are rejected.
;   - The trunk's context (from-trunk in extensions.conf) only answers calls; nothing in the
;     dialplan can dial out, so the trunk can't be abused for toll fraud.
;   - The firewall only lets the provider reach port 5060 and the RTP ports (see README).

[global]
type=global
user_agent=PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; A TransIP VPS has its public IP directly on its network interface, so no NAT settings are
; needed. Behind NAT you would set external_media_address / external_signaling_address here.

; Register with the provider so it knows where to send incoming calls.
[trunk-registration]
type=registration
transport=transport-udp
outbound_auth=trunk-auth
server_uri=sip:SIP_SERVER
client_uri=sip:SIP_USERNAME@SIP_SERVER
contact_user=SIP_USERNAME
expiration=300
retry_interval=60
forbidden_retry_interval=600
max_retries=10000
; Incoming calls carry this registration's "line" parameter, so they are matched to the
; trunk even if the provider sends them from an IP not listed under [trunk-identify].
line=yes
endpoint=trunk

[trunk-auth]
type=auth
auth_type=userpass
username=SIP_USERNAME
password=SIP_PASSWORD

[trunk]
type=aor
contact=sip:SIP_SERVER
qualify_frequency=60

[trunk]
type=endpoint
transport=transport-udp
context=from-trunk
aors=trunk
outbound_auth=trunk-auth
disallow=all
; G.711 A-law is standard in Europe; no transcoding needed, so CPU use stays negligible.
allow=alaw,ulaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
allow_subscribe=no
; Hang up calls with dead media (e.g. the provider lost the call) after 30 s.
rtp_timeout=30

[trunk-identify]
type=identify
endpoint=trunk
; One line per signalling IP or subnet your provider lists.
match=PROVIDER_IP
